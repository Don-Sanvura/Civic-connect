name: CivicConnect M3 quality gates
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  pull-requests: read
concurrency:
  group: civicconnect-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build, tests, dependency and secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Synthetic performance baseline
        run: |
          cp .env.example .env
          npm start > /tmp/civicconnect-server.log 2>&1 &
          echo $! > /tmp/civicconnect-server.pid
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/health; then
              break
            fi
            sleep 1
          done
          LOAD_TEST_REQUESTS=25 npm run load
      - name: Stop synthetic test server
        if: always()
        run: |
          if [ -f /tmp/civicconnect-server.pid ]; then
            kill "$(cat /tmp/civicconnect-server.pid)" || true
          fi
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v3
