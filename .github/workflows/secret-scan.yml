name: Secret scan

# Evidence for NFR-005: no credential, key, token or connection string in the repository.
# This lightweight guard complements, but does not replace, GitHub native secret scanning.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for credential patterns
        shell: bash
        run: |
          set -euo pipefail
          PATTERNS='(password|passwd|pwd)[[:space:]]*[=:][[:space:]]*["'"'"'][^"'"'"']{4,}|api[_-]?key[[:space:]]*[=:]|secret[_-]?key[[:space:]]*[=:]|BEGIN (RSA|OPENSSH|DSA|EC) PRIVATE KEY|xox[baprs]-[0-9a-zA-Z-]+|gh[pousr]_[0-9a-zA-Z]{30,}|AKIA[0-9A-Z]{16}|mongodb(\+srv)?://[^[:space:]]*:[^[:space:]]*@|postgres(ql)?://[^[:space:]]*:[^[:space:]]*@'
          if grep -rInE --binary-files=without-match \
               --exclude-dir=.git \
               --exclude-dir=node_modules \
               --exclude=secret-scan.yml \
               "$PATTERNS" . ; then
            echo "::error::Possible secret detected. Do not merge. Rotate the credential if it is real, then purge it from history."
            exit 1
          fi
          echo "No credential patterns found."

      - name: Check for committed environment files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)appsettings\.(Development|Production)\.json$|\.pem$|\.pfx$|\.p12$' | grep -vE '(^|/)\.env(\.staging)?\.example$'; then
            echo "::error::Environment or key file is tracked. Remove it and add it to .gitignore."
            exit 1
          fi
          echo "No environment or key files tracked."
